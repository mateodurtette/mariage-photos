<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lauriane & Matéo - Partagez vos photos !</title>
  
  <!-- Logo dans l'onglet du navigateur (favicon) -->
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fdfbf7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #eae5d9;
    }
    
    /* Style pour ajuster le logo en haut de la carte */
    .logo {
      max-width: 100px;
      height: auto;
      margin-bottom: 15px;
      border-radius: 50%;
    }

    h1 { font-family: serif; color: #5a4a42; margin-bottom: 8px; font-size: 1.8rem; }
    p { color: #776e65; margin-bottom: 24px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; text-align: left; }
    label { display: block; font-size: 0.85rem; color: #5a4a42; margin-bottom: 6px; font-weight: 600; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .btn {
      border: none;
      color: white;
      background: #8b7355;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active { background: #6e5a42; }
    .upload-btn-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      height: 100%;
      width: 100%;
    }
    #status { margin-top: 20px; font-weight: 600; font-size: 0.95rem; }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
    .loading { color: #d81b60; }

    /* Styles pour la section Cagnotte */
    .divider {
      margin: 30px 0 25px 0;
      border: 0;
      border-top: 1px dashed #d8cfc4;
    }
    .cagnotte-title {
      font-family: serif;
      color: #5a4a42;
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .cagnotte-text {
      font-size: 0.88rem;
      color: #776e65;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .btn-leetchi {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: #e02f5c;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 10px rgba(224, 47, 92, 0.25);
    }
    .btn-leetchi:active {
      background: #c8244e;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Image du logo -->
    <img src="logo.png" alt="Logo Mariage" class="logo">
    
    <h1>Lauriane & Matéo</h1>
    <p>Ajoutez vos meilleurs souvenirs de la journée à notre album photo !</p>

    <!-- SECTION ENVOI DE PHOTOS -->
    <div class="form-group">
      <label for="prenom">Votre prénom (optionnel) :</label>
      <input type="text" id="prenom" placeholder="ex: Julie">
    </div>

    <div class="upload-btn-wrapper">
      <button class="btn">📸 Sélectionner / Prendre des photos</button>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </div>

    <div id="status"></div>

    <!-- SÉPARATEUR VISUEL -->
    <hr class="divider">

    <!-- SECTION CAGNOTTE LEETCHI -->
    <h2 class="cagnotte-title">Cagnotte de mariage 🎁</h2>
    <p class="cagnotte-text">
      Votre présence est notre plus beau cadeau. Pour celles et ceux qui souhaitent participer à nos projets ou donner à distance :
    </p>
    
    <a href="https://www.leetchi.com/fr/c/lauriane-mateo-2607997?u=58916c81-2314-4fac-a648-cc3e223ad341&utm_source=copylink&utm_medium=social_sharing&utm_id=post_creation" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn-leetchi">
       💝 Participer sur Leetchi
    </a>
  </div>

  <script>
    const photoInput = document.getElementById('photoInput');
    const prenomInput = document.getElementById('prenom');
    const statusDiv = document.getElementById('status');

    photoInput.addEventListener('change', async () => {
      const files = photoInput.files;
      if (!files || files.length === 0) return;

      const totalFiles = files.length;
      let successCount = 0;

      statusDiv.className = 'loading';

      for (let i = 0; i < totalFiles; i++) {
        const file = files[i];
        statusDiv.innerText = `Envoi en cours... (${i + 1}/${totalFiles}) ⏳`;

        const formData = new FormData();
        formData.append('photo', file);
        formData.append('prenom', prenomInput.value);

        try {
          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();

          if (response.ok && result.success) {
            successCount++;
          }
        } catch (err) {
          console.error('Erreur d\'envoi pour le fichier', file.name, err);
        }
      }

      if (successCount === totalFiles) {
        statusDiv.className = 'success';
        statusDiv.innerText = totalFiles > 1 
          ? `✅ Les ${totalFiles} photos ont été envoyées avec succès ! Merci !`
          : '✅ Photo envoyée avec succès ! Merci !';
      } else if (successCount > 0) {
        statusDiv.className = 'success';
        statusDiv.innerText = `⚠️ ${successCount}/${totalFiles} photos envoyées avec succès.`;
      } else {
        statusDiv.className = 'error';
        statusDiv.innerText = '❌ Erreur lors de l\'envoi. Réessayez.';
      }

      photoInput.value = '';
    });
  </script>

</body>
</html>
